{% extends 'academic/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 text-center">
            <div class="card-body p-5">
                <div class="mb-4">
                    <i class="bi bi-box-arrow-right display-4 text-primary"></i>
                </div>

                <h2 class="mb-3">{{ title }}</h2>
                <p class="text-muted mb-4">{{ message }}</p>

                <a href="{{ login_url }}" class="btn btn-primary btn-lg px-4 rounded-pill">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Volver a iniciar sesión
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
