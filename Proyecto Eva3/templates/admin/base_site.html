{% extends "admin/base.html" %}
{% load static %}

{# Identidad Dulce Arte en el admin: branding + design system completo #}

{% block title %}{{ site_title }} | {{ site_header }}{% endblock %}

{% block extrastyle %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/admin_dulce.css' %}">

{% block branding %}

{% endblock %}
