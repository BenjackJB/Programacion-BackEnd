<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}API - BackendPro{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background: linear-gradient(120deg,#f8fafc,#eef2ff); }
      .card-hero { border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
      <div class="container">
        <a class="navbar-brand" href="/">BackendPro</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/admin/">Login</a></li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" id="programmersDropdown" role="button" data-bs-toggle="dropdown">
                Programmers
              </a>
              <ul class="dropdown-menu" aria-labelledby="programmersDropdown">
                <li><a class="dropdown-item" href="/api/programmers/">Ver Programadores</a></li>
                <li><a class="dropdown-item" href="{% url 'programmer_create' %}">+ Agregar</a></li>
              </ul>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" id="projectsDropdown" role="button" data-bs-toggle="dropdown">
                Projects
              </a>
              <ul class="dropdown-menu" aria-labelledby="projectsDropdown">
                <li><a class="dropdown-item" href="/api/projects/">Ver Proyectos</a></li>
                <li><a class="dropdown-item" href="{% url 'project_create' %}">+ Agregar</a></li>
              </ul>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" id="skillsDropdown" role="button" data-bs-toggle="dropdown">
                Skills
              </a>
              <ul class="dropdown-menu" aria-labelledby="skillsDropdown">
                <li><a class="dropdown-item" href="/api/skills/">Ver Habilidades</a></li>
                <li><a class="dropdown-item" href="{% url 'skill_create' %}">+ Agregar</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container">
      {% block content %}{% endblock %}
    </div>
    <footer class="text-center mt-5 mb-4 text-muted">
      <small>© BackendPro • Plantillas generadas automáticamente</small>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
